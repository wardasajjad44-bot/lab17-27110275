<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F1ECE2">
  <title>Check-in — Unscroll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #F1ECE2;
      --ink: #1E1E1C;
      --moss: #4E5B31;
      --apricot: #E2894F;
      --rule: 1px solid var(--ink);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Sans", sans-serif;
    }

    button, a { color: inherit; font: inherit; }
    button { cursor: pointer; }

    .site-header, main, footer {
      width: min(100% - 64px, 1120px);
      margin-inline: auto;
    }

    .site-header {
      min-height: 126px;
      padding: 28px 0 22px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      border-bottom: var(--rule);
    }

    .brand { display: flex; flex-direction: column; gap: 5px; }
    .brand-name {
      color: inherit;
      font-family: "Instrument Serif", serif;
      font-size: 2.2rem;
      line-height: 1;
      text-decoration: none;
    }
    .tagline { margin: 0; font-size: .76rem; letter-spacing: .01em; }
    nav { display: flex; gap: 28px; padding-top: 9px; }
    nav a {
      font-size: .84rem;
      text-decoration-thickness: 1px;
      text-underline-offset: 5px;
    }
    nav a[aria-current="page"] { text-decoration: underline; }

    main {
      min-height: calc(100vh - 210px);
      padding: 52px 0 72px;
    }

    .checkin, .results { width: min(100%, 760px); margin-inline: auto; }
    .progress-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 20px;
      margin-bottom: 12px;
      font-family: "IBM Plex Mono", monospace;
      font-size: .72rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .progress-count { letter-spacing: 0; }
    .segments { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
    .segment { height: 4px; background: color-mix(in srgb, var(--ink) 18%, transparent); }
    .segment.is-complete, .segment.is-current { background: var(--apricot); }

    .question-wrap {
      margin-top: clamp(42px, 8vw, 88px);
      transition: opacity 220ms ease, transform 220ms ease;
    }
    .question-wrap.is-leaving { opacity: 0; transform: translateX(-22px); }
    .question-wrap.is-entering { animation: question-enter 300ms ease both; }
    @keyframes question-enter {
      from { opacity: 0; transform: translateX(22px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .area-name, .eyebrow {
      margin: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: .74rem;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .question-title {
      max-width: 700px;
      margin: 20px 0 34px;
      font-family: "Instrument Serif", serif;
      font-size: clamp(2.6rem, 6vw, 4.7rem);
      font-weight: 400;
      line-height: .98;
      text-wrap: pretty;
    }
    .answers { border-top: var(--rule); }
    .answer {
      position: relative;
      width: 100%;
      min-height: 72px;
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: center;
      gap: 14px;
      overflow: hidden;
      padding: 16px 10px 16px 2px;
      border: 0;
      border-bottom: var(--rule);
      background: transparent;
      text-align: left;
      transition: padding-left 180ms ease, opacity 240ms ease;
    }
    .answer::before {
      position: absolute;
      z-index: 0;
      inset: 0;
      background: var(--apricot);
      content: "";
      transform: scaleX(0);
      transform-origin: left;
    }
    .answer:hover:not(:disabled) { padding-left: 12px; }
    .answer:focus-visible { outline: 2px solid var(--apricot); outline-offset: -3px; }
    .answer-letter, .answer-text, .noted {
      position: relative;
      z-index: 1;
    }
    .answer-letter {
      font-family: "IBM Plex Mono", monospace;
      font-size: .8rem;
    }
    .answer-text { max-width: 620px; font-size: .95rem; line-height: 1.5; }
    .noted {
      opacity: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: .67rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .answer.is-selected::before { animation: sweep 420ms ease-out forwards; }
    .answer.is-selected .noted { opacity: 1; transition: opacity 180ms ease 180ms; }
    .answer.is-faded { opacity: .25; }
    .answer:disabled { cursor: default; }
    @keyframes sweep { to { transform: scaleX(1); } }

    .results { animation: question-enter 400ms ease both; }
    .result-hero {
      padding: 20px 0 30px;
      border-bottom: var(--rule);
    }
    .score {
      margin: 12px 0 4px -.07em;
      font-family: "IBM Plex Mono", monospace;
      font-size: clamp(5rem, 17vw, 10.5rem);
      font-weight: 400;
      letter-spacing: -.09em;
      line-height: .95;
      font-variant-numeric: tabular-nums;
    }
    .score small { font-size: .34em; letter-spacing: -.04em; }
    .result-label {
      display: inline-block;
      margin: 14px 0 16px;
      padding: 6px 9px;
      background: var(--apricot);
      font-family: "IBM Plex Mono", monospace;
      font-size: .78rem;
    }
    .summary { max-width: 600px; margin: 0; font-size: 1rem; line-height: 1.65; }

    .area-results { margin-top: 31px; border-top: var(--rule); }
    .area-row {
      display: grid;
      grid-template-columns: minmax(100px, 150px) 1fr 44px;
      align-items: center;
      gap: 18px;
      min-height: 60px;
      border-bottom: var(--rule);
    }
    .area-label { font-family: "IBM Plex Mono", monospace; font-size: .75rem; }
    .bar-track { height: 7px; background: color-mix(in srgb, var(--ink) 16%, transparent); }
    .bar-fill {
      width: 0;
      height: 100%;
      background: var(--moss);
      transition: width 850ms cubic-bezier(.2,.7,.2,1);
    }
    .area-row.is-weakest .bar-fill { background: var(--apricot); }
    .area-score {
      text-align: right;
      font-family: "IBM Plex Mono", monospace;
      font-size: .75rem;
      font-variant-numeric: tabular-nums;
    }
    .strengths { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 31px; }
    .strengths p { margin: 8px 0 0; font-size: .92rem; line-height: 1.55; }
    .tips { margin-top: 40px; }
    .tips h2 {
      margin: 0;
      padding-bottom: 13px;
      border-bottom: var(--rule);
      font-family: "Instrument Serif", serif;
      font-size: 2rem;
      font-weight: 400;
    }
    .tips-list { margin: 0; padding: 0; list-style: none; counter-reset: tip; }
    .tips-list li {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 10px;
      padding: 15px 0;
      border-bottom: var(--rule);
      counter-increment: tip;
      font-size: .9rem;
      line-height: 1.55;
    }
    .tips-list li::before {
      content: "0" counter(tip);
      font-family: "IBM Plex Mono", monospace;
      font-size: .72rem;
    }
    .preset-note { margin: 34px 0 12px; font-size: .9rem; }
    .result-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 24px; }
    .focus-link {
      display: inline-block;
      padding: 13px 18px;
      border: 1px solid var(--moss);
      background: var(--moss);
      color: var(--paper);
      font-size: .84rem;
      font-weight: 600;
      text-decoration: none;
    }
    .again-link {
      font-size: .84rem;
      text-underline-offset: 4px;
    }
    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--apricot);
      outline-offset: 3px;
    }

    footer {
      min-height: 64px;
      padding: 20px 0;
      border-top: var(--rule);
      font-family: "IBM Plex Mono", monospace;
      font-size: .68rem;
    }

    @media (max-width: 760px) {
      .site-header, main, footer { width: min(100% - 40px, 600px); }
      .site-header { min-height: 110px; padding-top: 23px; }
      main { min-height: auto; padding: 36px 0 52px; }
      .question-wrap { margin-top: 54px; }
      .area-row { grid-template-columns: minmax(82px, 110px) 1fr 38px; gap: 12px; }
    }
    @media (max-width: 440px) {
      .site-header, main, footer { width: calc(100% - 32px); }
      .site-header { gap: 12px; }
      .brand-name { font-size: 1.9rem; }
      .tagline { max-width: 180px; font-size: .68rem; }
      nav { gap: 13px; }
      nav a { font-size: .75rem; }
      .question-title { margin-bottom: 28px; }
      .answer { grid-template-columns: 30px 1fr auto; gap: 10px; min-height: 68px; }
      .answer-text { font-size: .87rem; }
      .strengths { grid-template-columns: 1fr; gap: 22px; }
      .result-actions { gap: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <a class="brand-name" href="index.html">Unscroll</a>
      <p class="tagline">Put the phone down. Pick the day up.</p>
    </div>
    <nav aria-label="Main navigation">
      <a href="index.html">Focus</a>
      <a href="quiz.html" aria-current="page">Check-in</a>
    </nav>
  </header>

  <main>
    <section class="checkin" id="checkin" aria-label="Screen-time check-in">
      <div class="progress-head">
        <span>Check-in</span>
        <span class="progress-count" id="progress-count">01 / 08</span>
      </div>
      <div class="segments" id="segments" role="progressbar" aria-label="Check-in progress" aria-valuemin="1" aria-valuemax="8" aria-valuenow="1"></div>
      <div class="question-wrap" id="question-wrap" aria-live="polite">
        <p class="area-name" id="area-name"></p>
        <h1 class="question-title" id="question-title"></h1>
        <div class="answers" id="answers"></div>
      </div>
    </section>

    <section class="results" id="results" aria-labelledby="result-heading" hidden>
      <div class="result-hero">
        <p class="eyebrow" id="result-heading">Your check-in</p>
        <p class="score" id="score"></p>
        <span class="result-label" id="result-label"></span>
        <p class="summary" id="summary"></p>
      </div>

      <div class="area-results" id="area-results" aria-label="Scores by area"></div>

      <div class="strengths">
        <div>
          <p class="eyebrow">Strongest area</p>
          <p id="strongest"></p>
        </div>
        <div>
          <p class="eyebrow">Area to work on</p>
          <p id="weakest"></p>
        </div>
      </div>

      <section class="tips" aria-labelledby="tips-heading">
        <h2 id="tips-heading">A few small adjustments</h2>
        <ol class="tips-list" id="tips-list"></ol>
      </section>

      <p class="preset-note" id="preset-note"></p>
      <div class="result-actions">
        <a class="focus-link" id="focus-link" href="index.html">Open focus timer</a>
        <a class="again-link" href="quiz.html">Take it again</a>
      </div>
    </section>
  </main>

  <footer>Unscroll, 2026</footer>

  <script>
    (() => {
      const questions = [
        {
          area: "Mornings",
          prompt: "What happens in the first few minutes after you wake?",
          answers: [
            { text: "I reach for my phone before I’m properly awake.", value: 0 },
            { text: "I check a couple of things, then get moving.", value: 1 },
            { text: "I give myself a little time before checking it.", value: 2 }
          ]
        },
        {
          area: "Mornings",
          prompt: "How often does your morning start the way you meant it to?",
          answers: [
            { text: "Rarely. The screen tends to decide the pace.", value: 0 },
            { text: "Some days, depending on what’s waiting for me.", value: 1 },
            { text: "Often. I have a simple start that works for me.", value: 2 }
          ]
        },
        {
          area: "Impulse",
          prompt: "When a notification appears, what do you usually do?",
          answers: [
            { text: "Open it right away, even if I was doing something else.", value: 0 },
            { text: "Check it if it seems important.", value: 1 },
            { text: "Leave most notifications until I choose to check.", value: 2 }
          ]
        },
        {
          area: "Impulse",
          prompt: "When you open an app without meaning to, how often does that happen?",
          answers: [
            { text: "Several times a day. It’s mostly automatic.", value: 0 },
            { text: "Now and then, usually when I have a spare moment.", value: 1 },
            { text: "Not often. I usually know why I picked up my phone.", value: 2 }
          ]
        },
        {
          area: "Focus",
          prompt: "How does your phone fit into time you set aside to focus?",
          answers: [
            { text: "It stays nearby, and I check it while I work.", value: 0 },
            { text: "I silence it sometimes, but it’s still within reach.", value: 1 },
            { text: "I put it out of reach for a while.", value: 2 }
          ]
        },
        {
          area: "Focus",
          prompt: "How often do you switch to your phone while doing one task?",
          answers: [
            { text: "Often. I lose my place more than I’d like.", value: 0 },
            { text: "A few times, especially between parts of the task.", value: 1 },
            { text: "Not much. I try to finish a stretch before switching.", value: 2 }
          ]
        },
        {
          area: "Nights",
          prompt: "What does the last half-hour before sleep usually look like?",
          answers: [
            { text: "I’m scrolling until I’m too tired to continue.", value: 0 },
            { text: "I use my phone, then put it away when I remember.", value: 1 },
            { text: "I usually put it aside before getting into bed.", value: 2 }
          ]
        },
        {
          area: "Nights",
          prompt: "How rested do you feel after a night with your usual screen habits?",
          answers: [
            { text: "Not very. I often stay up longer than I planned.", value: 0 },
            { text: "It varies. Some nights go better than others.", value: 1 },
            { text: "Mostly rested. My evenings have a reasonable stopping point.", value: 2 }
          ]
        }
      ];

      const tipsByArea = {
        Mornings: [
          "Leave your phone outside arm’s reach overnight. Decide what the first few minutes are for before bed.",
          "Try a short, screen-free start: open a window, make a drink, or get dressed first.",
          "Move the apps you check first off your home screen. A little friction can make the choice yours again."
        ],
        Impulse: [
          "Turn off notifications that do not need an immediate answer. Keep the useful ones.",
          "Before opening an app, name what you came to do. Close it when that is done.",
          "Put a small pause between the urge and the screen. One breath is enough to notice the choice."
        ],
        Focus: [
          "For one work stretch, leave your phone in another room or inside a drawer.",
          "Choose a single task and a short timer. You can check your phone when it ends.",
          "Silence non-essential alerts during focused time. Let people know when you will be available."
        ],
        Nights: [
          "Pick a gentle stopping point for scrolling, then charge your phone away from the bed.",
          "Replace the last few minutes of screen time with something low effort, like a paper book or quiet music.",
          "Set a bedtime reminder that gives you enough time to wind down, not just another notification to dismiss."
        ]
      };

      const areaNames = ["Mornings", "Impulse", "Focus", "Nights"];
      const segments = document.getElementById("segments");
      const questionWrap = document.getElementById("question-wrap");
      const areaName = document.getElementById("area-name");
      const questionTitle = document.getElementById("question-title");
      const answers = document.getElementById("answers");
      const progressCount = document.getElementById("progress-count");
      const checkin = document.getElementById("checkin");
      const results = document.getElementById("results");
      const responseValues = [];
      let questionIndex = 0;
      let choosing = false;

      function renderProgress() {
        segments.replaceChildren();
        questions.forEach((question, index) => {
          const segment = document.createElement("span");
          segment.className = "segment";
          if (index < questionIndex) segment.classList.add("is-complete");
          if (index === questionIndex) segment.classList.add("is-current");
          segment.setAttribute("aria-hidden", "true");
          segments.append(segment);
        });
        const displayedQuestion = Math.min(questionIndex + 1, questions.length);
        progressCount.textContent = `${String(displayedQuestion).padStart(2, "0")} / 08`;
        segments.setAttribute("aria-valuenow", String(displayedQuestion));
      }

      function renderQuestion() {
        const question = questions[questionIndex];
        areaName.textContent = question.area;
        questionTitle.textContent = question.prompt;
        answers.replaceChildren();
        question.answers.forEach((answer, answerIndex) => {
          const button = document.createElement("button");
          button.className = "answer";
          button.type = "button";
          button.innerHTML = `<span class="answer-letter">${String.fromCharCode(65 + answerIndex)}</span><span class="answer-text"></span><span class="noted">Noted</span>`;
          button.querySelector(".answer-text").textContent = answer.text;
          button.addEventListener("click", () => selectAnswer(button, answer.value));
          answers.append(button);
        });
        renderProgress();
      }

      function selectAnswer(selectedButton, value) {
        if (choosing) return;
        choosing = true;
        responseValues[questionIndex] = value;
        answers.querySelectorAll(".answer").forEach((button) => {
          button.disabled = true;
          if (button === selectedButton) button.classList.add("is-selected");
          else button.classList.add("is-faded");
        });

        window.setTimeout(() => {
          questionIndex += 1;
          choosing = false;
          if (questionIndex === questions.length) {
            showResults();
            return;
          }
          questionWrap.classList.add("is-leaving");
          window.setTimeout(() => {
            renderQuestion();
            questionWrap.classList.remove("is-leaving");
            questionWrap.classList.remove("is-entering");
            void questionWrap.offsetWidth;
            questionWrap.classList.add("is-entering");
          }, 220);
        }, 560);
      }

      function showResults() {
        const scores = Object.fromEntries(areaNames.map((area) => {
          const areaQuestions = questions
            .map((question, index) => ({ question, value: responseValues[index] }))
            .filter((entry) => entry.question.area === area);
          const total = areaQuestions.reduce((sum, entry) => sum + entry.value, 0);
          return [area, Math.round((total / (areaQuestions.length * 2)) * 100)];
        }));
        const score = Math.round(responseValues.reduce((sum, value) => sum + value, 0) / (questions.length * 2) * 100);
        const sortedAreas = [...areaNames].sort((a, b) => scores[b] - scores[a]);
        const strongestArea = sortedAreas[0];
        const weakestAreas = [...areaNames].sort((a, b) => scores[a] - scores[b]);
        const weakestArea = weakestAreas[0];
        const label = score >= 70 ? "Balanced" : score >= 40 ? "Slipping" : "Time to unplug";
        const summaries = {
          Balanced: "Your screen habits seem to leave room for the rest of the day. Keep the parts that are working, and adjust only what feels useful.",
          Slipping: "Some habits are working, and a few are taking more space than you want. A small change in one part of the day is a sensible place to begin.",
          "Time to unplug": "Your phone may be crowding out more of the day than you would like. Start with one gentle boundary, then see how it feels."
        };
        const preset = score < 40 ? "15-3" : score < 70 ? "25-5" : "50-10";

        document.getElementById("score").innerHTML = `${score}<small>/100</small>`;
        document.getElementById("result-label").textContent = label;
        document.getElementById("summary").textContent = summaries[label];
        document.getElementById("strongest").textContent = `${strongestArea} — ${scores[strongestArea]}/100. ${strongestArea === "Mornings" ? "Your starts have a little space in them." : strongestArea === "Impulse" ? "You often decide when to check." : strongestArea === "Focus" ? "You make room for sustained attention." : "You have some useful evening boundaries."}`;
        document.getElementById("weakest").textContent = `${weakestArea} — ${scores[weakestArea]}/100. ${weakestArea === "Mornings" ? "A calmer first few minutes could help." : weakestArea === "Impulse" ? "A pause can make checking more deliberate." : weakestArea === "Focus" ? "A little distance may help protect your attention." : "An earlier stopping point may make nights easier."}`;
        const areaResults = document.getElementById("area-results");
        areaResults.replaceChildren();
        areaNames.forEach((area) => {
          const row = document.createElement("div");
          row.className = `area-row${area === weakestArea ? " is-weakest" : ""}`;
          row.innerHTML = `<span class="area-label"></span><span class="bar-track" aria-hidden="true"><span class="bar-fill"></span></span><span class="area-score"></span>`;
          row.querySelector(".area-label").textContent = area;
          row.querySelector(".area-score").textContent = String(scores[area]);
          row.setAttribute("aria-label", `${area}: ${scores[area]} out of 100`);
          areaResults.append(row);
          window.requestAnimationFrame(() => {
            row.querySelector(".bar-fill").style.width = `${scores[area]}%`;
          });
        });

        const tipsList = document.getElementById("tips-list");
        tipsList.replaceChildren();
        for (let index = 0; index < 3; index += 1) {
          const area = weakestAreas[index % weakestAreas.length];
          const tip = tipsByArea[area][Math.floor(index / weakestAreas.length)];
          const item = document.createElement("li");
          item.textContent = tip;
          tipsList.append(item);
        }
        document.getElementById("preset-note").textContent = `Suggested focus session: ${preset.replace("-", " / ")} minutes.`;
        document.getElementById("focus-link").href = `index.html?preset=${preset}`;

        checkin.hidden = true;
        results.hidden = false;
        document.title = `${score}/100 — Unscroll`;
        results.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      renderQuestion();
    })();
  </script>
</body>
</html>
